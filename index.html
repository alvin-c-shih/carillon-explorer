<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carillon Explorer</title>
<style>
  :root {
    --ink: #f3ecdf;
    --ink-dim: #b9b2a4;
    --panel: rgba(20, 24, 32, .9);
    --line: rgba(243, 236, 223, .14);
    --bronze: #d9a441;
    --bronze-deep: #9a6b2c;
    --wood: #d8b98a;
    --wood-dark: #5a4129;
    --kbh: 152px;
    /* room for a phone's notch, rounded corners and home bar */
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
    --lane: 120px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ee;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #panel { position: fixed; left: calc(16px + var(--sl)); top: calc(16px + var(--st)); bottom: calc(var(--kbh) + 28px + var(--sb)); width: 350px;
    background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 22px 16px; display: flex; flex-direction: column; }
  #eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); }
  #panel h1 { font: 600 26px/1.15 "Iowan Old Style", Palatino, Georgia, serif; margin: 6px 0 10px; text-wrap: balance; }
  #body { overflow-y: auto; flex: 1; padding-right: 4px; }
  #body.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 44px), transparent); mask-image: linear-gradient(#000 calc(100% - 44px), transparent); }
  #body p { margin: 0 0 11px; }
  #body b { color: #fff; font-weight: 600; }
  #body .try { border-left: 2px solid var(--bronze); padding: 2px 0 2px 10px; color: var(--ink-dim); }
  #body kbd { font: 12px ui-monospace, Menlo, monospace; background: rgba(255,255,255,.1);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  #nav { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  #dots { flex: 1; display: flex; justify-content: center; }
  #dots { gap: 0; }
  #dots button { width: 21px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }   /* a small dot in a finger-sized target */
  #dots button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: rgba(243,236,223,.5); }
  #dots button.on::before { background: var(--bronze); }
  button.btn, a.btn { font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; cursor: pointer; }
  a.btn { display: inline-block; text-decoration: none; }
  button.btn:hover, a.btn:hover { background: rgba(255,255,255,.16); }
  button.btn.primary { background: var(--bronze); border-color: var(--bronze); color: #1d1608; font-weight: 600; }
  button.btn.primary:hover { background: #e8b655; }
  button.btn:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  canvas#scene:focus-visible { outline-offset: -4px; }
  #title:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .photoBtn { display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 8px; cursor: zoom-in; }
  #lbClose { float: right; margin-top: -30px; }
  #typing { margin-left: 14px; padding: 1px 9px; font-size: 11px; }
  #typing[aria-pressed="false"] { color: var(--bronze); border-color: var(--bronze); }
  #pedcap { gap: 0; }

  .stack { display: grid; gap: 7px; margin: 4px 0 12px; }
  .stack.two { grid-template-columns: 1fr 1fr; }
  .stack.two .wide { grid-column: 1 / -1; justify-content: center; }
  .stack button.btn { text-align: left; display: flex; justify-content: space-between; gap: 10px; }
  .stack button.btn span { color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  label.check { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-dim); margin-bottom: 10px; cursor: pointer; }

  #tools { position: fixed; right: calc(16px + var(--sr)); top: calc(16px + var(--st)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #tools button.btn { background: var(--panel); }
  #tools button.btn[aria-pressed="true"] { border-color: var(--bronze); color: var(--bronze); }
  #tunePop { display: none; width: 290px; background: var(--panel); border: 1px solid var(--bronze); border-radius: 10px; padding: 10px 12px 4px; }
  #tunePop.on { display: block; }
  #tunePop p { margin: 0 0 8px; font-size: 13px; color: var(--ink-dim); }
  body.atlas #tunesBtn, body.atlas #tunePop { display: none !important; }
  #tools button.btn.primary { background: var(--bronze); }
  #vol { display: flex; align-items: center; gap: 8px; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; }
  #vol input { width: 74px; accent-color: var(--bronze); }
  button.btn.link { padding: 0 8px; font-size: 13px; color: var(--bronze); }
  #chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
    font-variant-numeric: tabular-nums; max-width: 300px; display: none; }
  #chip b { color: var(--bronze); }

  #labels { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #labels.on { opacity: 1; }
  #labels div, #atlasLabels div { position: absolute; transform: translate(8px, -50%); white-space: nowrap; font-size: 13px;
    background: rgba(20,24,32,.85); border-radius: 5px; padding: 1px 7px; }
  #labels div::before, #atlasLabels div::before { content: ""; position: absolute; left: -12px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--dot, var(--bronze)); box-shadow: 0 0 0 2px rgba(20,24,32,.85); }

  #atlasLabels { position: fixed; inset: 0; pointer-events: none; }
  #atlasLabels div { pointer-events: auto; cursor: pointer; }
  #atlasLabels div.sel { background: var(--bronze); color: #1d1608; font-weight: 600; }
  body.atlas #kbwrap, body.atlas #labels, body.atlas #xray, body.atlas #chip, body.atlas #dots button { display: none !important; }
  body.atlas #panel { bottom: calc(16px + var(--sb)); }
  #atlasHint { display: none; position: fixed; bottom: calc(22px + var(--sb)); left: calc(50% + 183px); transform: translateX(-50%); white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-size: 13px;
    pointer-events: none; transition: opacity .6s; }
  body.atlas #atlasHint { display: block; }
  #atlasHint.gone { opacity: 0; }
  .tabs { display: flex; gap: 3px; background: rgba(255,255,255,.07); border-radius: 10px; padding: 3px; margin: 0 0 10px; }
  .tabs button { flex: 1; font: inherit; font-weight: 600; color: var(--ink-dim); background: none; border: 0; border-radius: 8px; padding: 6px 0; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--bronze); color: #1d1608; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 9px; }
  .chips button { font: inherit; font-size: 12px; color: var(--ink-dim); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .chips button[aria-pressed="true"] { color: var(--bronze); border-color: var(--bronze); }
  .chips button.lucky { margin-left: auto; background: var(--bronze); border-color: var(--bronze); color: #1d1608; font-weight: 600; }
  .rows { margin: 0 -8px 10px; }
  .row { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
  .row:hover, .row:focus-visible { background: rgba(255,255,255,.09); }
  .row small { display: block; font-size: 12px; color: var(--ink-dim); line-height: 1.35; }
  .row.card { grid-template-columns: 1fr; border: 1px solid var(--line); margin-bottom: 6px; padding: 8px 10px; font-weight: 600; }
  .row.card small { font-weight: 400; }
  .row.star > span:first-child { color: var(--bronze); }
  .row.star small { color: var(--ink-dim); }
  #fq, .pick select { font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  #fq { width: 100%; margin: 0 0 7px; }
  #fq::placeholder { color: var(--ink-dim); }
  .pick { display: grid; grid-template-columns: 1.5fr 1fr; gap: 7px; margin: 0 0 8px; }
  .pick select { min-width: 0; }
  .pick option, .pick optgroup { color: #111; background: #fff; }
  #fq:focus-visible, .pick select:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 9px; }
  .legend button { font: inherit; font-size: 12px; color: var(--ink-dim); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 8px; cursor: pointer; }
  .legend button b { font-weight: 400; opacity: .7; }
  .legend button[aria-pressed="true"] { color: #fff; border-color: #fff; }
  #real audio { width: 100%; height: 36px; margin: 0 0 4px; }
  #real small { display: block; font-size: 11px; }
  #real small a { color: var(--ink-dim); }
  .count { font-size: 12px; color: var(--ink-dim); margin: 0 0 4px !important; }
  .photo img { cursor: zoom-in; }
  #lightbox { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(8,10,16,.86); align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
  #lightbox.on { display: flex; }
  #lightbox figure { margin: 0; max-width: min(900px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: default; }
  #lightbox img { display: block; max-width: 100%; max-height: calc(100vh - 190px); min-height: 120px; min-width: 240px; margin: 0 auto; background: rgba(255,255,255,.05); }
  #lightbox figcaption { padding: 12px 18px 14px; }
  #lightbox h2 { font: 600 20px/1.2 "Iowan Old Style", Palatino, Georgia, serif; margin: 0 0 2px; }
  #lightbox p { margin: 0 0 4px; color: var(--ink-dim); }
  #lightbox a { font-size: 11px; color: var(--ink-dim); }
  .meter { display: flex; align-items: center; gap: 7px; }
  .meter i { height: 6px; border-radius: 3px; background: var(--bronze); min-width: 2px; }
  .meter b { font-weight: 400; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  body.site #atlasHint { display: none; }
  #body h2 { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin: 14px 0 6px; }
  .photo { margin: 0 0 12px; min-height: 60px; }
  .photo img { display: block; width: 100%; height: 190px; object-fit: cover; object-position: center 25%; border-radius: 8px; background: rgba(255,255,255,.06); }
  .photo figcaption { font-size: 11px; margin-top: 3px; }
  .photo a { color: var(--ink-dim); }
  #body .try a { color: inherit; }
  #body p a:not(.btn) { color: var(--bronze); }
  #body details { margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
  #body details[open] { padding-bottom: 2px; }
  #body summary { cursor: pointer; color: var(--bronze); font-weight: 600; }
  #body details p { margin-top: 9px; }
  #body details button.btn { padding: 1px 8px; }
  .spec { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0 0 12px; }
  .spec dt { color: var(--ink-dim); }
  .spec dd { margin: 0; font-variant-numeric: tabular-nums; }

  #kbwrap { position: fixed; left: calc(16px + var(--sl)); right: calc(16px + var(--sr)); bottom: calc(14px + var(--sb)); height: var(--kbh);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  #kb { position: relative; height: 100%; max-width: 1150px; margin: 0 auto; user-select: none; touch-action: none; }
  .key { position: absolute; border-radius: 999px; cursor: pointer; display: flex; align-items: flex-end;
    justify-content: center; font-size: 10px; padding-bottom: 5px; transition: transform .08s, filter .08s; }
  .key.nat { top: 34%; height: 38%; background: linear-gradient(#e6cba0, var(--wood)); color: #4b3a22;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .key.shp { top: 0; height: 31%; background: linear-gradient(#6d5034, var(--wood-dark)); color: #e6d2b3;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
  .key.down { transform: translateY(5px); filter: brightness(1.35) saturate(1.4); }
  .key i { font-style: normal; opacity: .75; text-transform: uppercase; }
  .key.ped { border-radius: 4px; padding: 0; }
  .key.ped.nat { top: 80%; height: 20%; }
  .key.ped.shp { top: 77%; height: 12%; z-index: 1; }
  #pedcap { position: absolute; left: 51.5%; top: 80%; height: 20%; display: flex; align-items: center;
    font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  .key.c::after { content: attr(data-name); position: absolute; top: 4px; font-size: 10px; font-weight: 700; }

  /* Falling notes above the batons while a tune plays */
  #lane { display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 11px); height: var(--lane); overflow: hidden; pointer-events: none;
    background: linear-gradient(rgba(20,24,32,0), rgba(20,24,32,.82) 70%); border-bottom: 2px solid var(--bronze); }
  body.song #lane { display: block; }
  body.song #panel { bottom: calc(var(--kbh) + var(--lane) + 34px + var(--sb)); }
  .fall { position: absolute; bottom: 0; height: 14px; border-radius: 7px; background: var(--bronze); color: #1d1608;
    font: 700 10px/14px ui-monospace, Menlo, monospace; text-align: center; text-transform: uppercase; }
  .fall.acc { background: rgba(243,236,223,.4); }
  .key.want { box-shadow: 0 0 0 2px #fff, 0 0 14px 4px var(--bronze); z-index: 2; }
  .tunes { margin: 0 0 10px; }
  .tunes div { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .tunes span { flex: 1; }
  .tunes button.btn { padding: 3px 9px; font-size: 13px; }
  .year { display: flex; align-items: baseline; gap: 12px; }
  .year b { font: 600 34px/1 "Iowan Old Style", Palatino, Georgia, serif; color: var(--bronze) !important; font-variant-numeric: tabular-nums; }
  .year span { color: var(--ink-dim); font-size: 13px; line-height: 1.3; }
  #hyear { width: 100%; margin: 0 0 10px; accent-color: var(--bronze); }
  #hstory { border-left: 2px solid var(--bronze); padding-left: 10px; margin: 0 0 12px; min-height: 96px; }
  #hstory h2 { margin-top: 0; color: var(--bronze); }
  .row.card.right { border-color: #7fc98a; background: rgba(127,201,138,.14); }
  .row.card.wrong { border-color: #e08a7a; background: rgba(224,138,122,.14); }
  .row:disabled { cursor: default; color: inherit; }
  .tabs button { font-size: 13px; }

  /* On large screens the extra controls sit in the column with the rest, and the panel cannot be folded */
  #panel, #kbwrap { z-index: 3; }   /* panels sit above the labels drawn over the scene */
  #tools { z-index: 4; }
  #more { display: contents; }
  #moreBtn, #fold { display: none; }
  button, .key, a.btn { touch-action: manipulation; }   /* no double-tap zoom on controls */
  #nav button { white-space: nowrap; }
  #labels div.flip, #atlasLabels div.flip { transform: translate(calc(-100% - 8px), -50%); }   /* a label near the right edge opens to the left */
  #labels div.flip::before, #atlasLabels div.flip::before { left: auto; right: -12px; }

  /* Compact screens (a phone either way up): the extra controls fold into a menu, and the guide panel can be folded */
  @media (max-width: 820px), (max-height: 500px) {
    #tools { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; left: calc(16px + var(--sl)); pointer-events: none; }
    #tools > * { pointer-events: auto; }
    #tools .btn, #vol { padding: 6px 11px; font-size: 13px; }
    #moreBtn { display: block; min-width: 40px; }
    #more { display: none; flex-basis: 100%; flex-wrap: wrap; justify-content: flex-end; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    #more.on { display: flex; }
    #tunePop { flex-basis: 100%; width: auto; }
    #chip { flex-basis: 100%; max-width: none; font-size: 13px; }
    #vol input { width: 90px; }
    #fold { display: block; position: absolute; top: 10px; right: 10px; padding: 2px 10px; }
    #panel.min { bottom: auto !important; max-height: none; }
    #panel.min #body { display: none; }
    #panel.min #nav { border-top: 0; padding-top: 4px; }
    #panel h1 { padding-right: 40px; }
    #pedcap { display: none; }
    #body .intro { display: none; }
    #dots button { width: 16px; }
  }
  /* A phone held upright: the guide across the top, controls just above the batons, and batons wide enough to tap */
  @media (max-width: 820px) {
    #panel { right: calc(16px + var(--sr)); width: auto; bottom: auto; max-height: 38vh; padding: 14px 16px 12px; }
    #panel h1 { font-size: 21px; }
    body.atlas #panel { bottom: auto; max-height: 50vh; }
    body.song #panel { bottom: auto; max-height: 26vh; }
    .photo img { height: 110px; }
    #tools { top: auto; bottom: calc(var(--kbh) + 24px + var(--sb)); }
    body.song #tools { bottom: calc(var(--kbh) + var(--lane) + 24px + var(--sb)); }
    body.atlas #tools { bottom: calc(16px + var(--sb)); }
    #more, #tunePop, #chip { order: -1; }   /* menus open above the row of buttons */
    #atlasHint { left: 50%; bottom: calc(64px + var(--sb)); font-size: 12px; }
    .key i { display: none; }
    /* The batons are 2.3 screens wide and scroll sideways; the falling-note lane sits inside the same scroller */
    #kbwrap { padding: 10px 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #kbwrap::-webkit-scrollbar { display: none; }
    #kb { width: 230%; max-width: none; margin: 0 12px; height: calc(var(--kbh) - 22px); }
    #kb, #kb .key { touch-action: pan-x; }
    body.song #kbwrap { height: calc(var(--kbh) + var(--lane)); padding-top: calc(10px + var(--lane)); }
    #lane { background: none; }
  }
  @media (max-height: 700px) {
    :root { --kbh: 128px; --lane: 92px; }
    html, body { font-size: 14px; }
    #panel { padding: 14px 18px 12px; }
    #panel h1 { font-size: 21px; margin: 4px 0 8px; }
    #body p { margin-bottom: 9px; }
    button.btn, a.btn { padding: 5px 11px; }
    .photo img { height: 150px; }
  }
  /* A phone held on its side: short, so everything shrinks a little */
  @media (max-height: 500px) {
    :root { --kbh: 108px; --lane: 70px; }
    #panel { width: 300px; padding: 10px 14px 8px; }
    #panel h1 { font-size: 18px; margin: 2px 0 6px; }
    #nav { padding-top: 6px; }
    #more { order: 1; }
    #tools { left: auto; max-width: 430px; }   /* stay in the corner, clear of the guide panel */
    .key i { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" role="img" aria-label="3D view"></canvas>
<div id="announce" class="sr" aria-live="polite"></div>
<div id="atlasLabels"></div>
<div id="atlasHint">Drag to spin · Scroll to zoom · Click a tower to fly there</div>

<aside id="panel" aria-label="Guide">
  <button class="btn" id="fold" aria-expanded="true" aria-controls="body" aria-label="Hide the text">▴</button>
  <div id="eyebrow"></div>
  <h1 id="title" tabindex="-1"></h1>
  <div id="body"></div>
  <div id="nav">
    <button class="btn" id="prev">Back</button>
    <div id="dots"></div>
    <button class="btn primary" id="next">Next</button>
  </div>
</aside>

<div id="tools" role="toolbar" aria-label="View and sound controls">
  <button class="btn primary" id="tunesBtn" aria-expanded="false">♪ Play a tune</button>
  <div id="tunePop"></div>
  <button class="btn" id="atlasBtn">World atlas</button>
  <button class="btn" id="moreBtn" aria-expanded="false" aria-controls="more" aria-label="More controls">☰</button>
  <div id="more">
    <button class="btn" id="xray" aria-pressed="false">See inside</button>
    <button class="btn" id="recenter">Reset view</button>
    <button class="btn" id="share">Copy link</button>
    <button class="btn" id="motion" title="Flights between views and the slow circling of the camera">Motion: on</button>
    <label class="btn" id="vol">Sound <input type="range" id="volume" min="0" max="100" value="100" aria-label="Volume"></label>
  </div>
  <div id="chip"></div>
</div>

<div id="labels" aria-hidden="true"></div>

<div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lbTitle"><figure><img alt=""><figcaption><h2 id="lbTitle"></h2><p></p><a target="_blank" rel="noopener"></a><button class="btn" id="lbClose">Close</button></figcaption></figure></div>

<div id="kbwrap"><div id="kb" role="group" aria-label="Baton keyboard and pedals. Arrow keys move between batons, down arrow reaches the pedals, Enter or Space strikes."><div id="pedcap"><span>◀ Pedals: the low bells again, for the feet (Shift + key)</span><button class="btn" id="typing" aria-pressed="true" title="When on, typing letters and digits plays the bells">Typing plays bells: on</button></div></div></div>

<script src="vendor/three.bundle.js"></script>
<script src="vendor/earth.js"></script>
<script src="vendor/countries.js"></script>
<script src="carillons.js"></script>
<script src="world.js"></script>
<script src="atlas.js"></script>
<script src="site.js"></script>
<script src="main.js"></script>
</body>
</html>
